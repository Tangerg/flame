<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      // Only the captured parent can transfer the single program channel.
      // The authored inner document never receives that port or a host bridge.
      window.addEventListener("message", function initialize(event) {
        if (
          event.source !== parent ||
          event.data?.type !== "flame-genui-connect" ||
          typeof event.data.id !== "string" ||
          event.ports.length !== 1
        )
          return;
        window.removeEventListener("message", initialize);
        const port = event.ports[0];
        const id = event.data.id;
        port.onmessage = (message) => {
          if (
            message.data?.type !== "flame-genui-content" ||
            message.data.id !== id ||
            typeof message.data.html !== "string" ||
            typeof message.data.title !== "string"
          )
            return;
          port.close();
          const frame = document.createElement("iframe");
          frame.sandbox = "allow-scripts";
          frame.referrerPolicy = "no-referrer";
          frame.title = message.data.title;
          frame.srcdoc =
            '<!doctype html><html><head><meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width,initial-scale=1">' +
            "<style>:root{color-scheme:light dark}html,body{margin:0;height:100%}" +
            "body{font:14px/1.5 system-ui,sans-serif}</style></head><body>" +
            message.data.html +
            "</body></html>";
          document.body.append(frame);
        };
        port.postMessage({ type: "flame-genui-ready", id });
      });
    </script>
  </body>
</html>
