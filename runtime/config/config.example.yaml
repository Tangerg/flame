# Flame runtime configuration (viper).
#
# Copy this file to config.yaml and choose a provider:
#   cp config/config.example.yaml config/config.yaml
#
# config.yaml is gitignored (it holds your key). Precedence, later wins:
#   built-in defaults  <  this file  <  env vars (FLAME_*)
# The file must be a regular YAML file no larger than 256 KiB.
# YAML keys are strict: an unknown or misspelled field fails startup instead of
# silently falling back to a default.
# YAML and environment values share one typed decode. Invalid boolean or integer
# overrides fail startup; list overrides use comma-separated entries.

# Exact provider identity. The selected installed model adapter publishes its catalog;
# use /providers in the interactive CLI (backed by providers.list) to inspect
# the current set instead of copying a versioned list from this example.
provider: anthropic

# Exact model id. The product default is anthropic/claude-opus-5.
# Every other provider requires an explicit model; names never infer a provider.
model: "claude-opus-5"

# Optional cheaper model for turn-boundary maintenance (compaction summaries,
# fact extraction, title generation) on the SAME provider as `model`. Empty
# runs that work on `model`. Use it to code with a strong model while the
# background summarize/extract/title calls run on an inexpensive one.
utilityModel: ""

# Optional first-run provider API key. Runtime may start with a required-key
# provider still unconfigured so the interactive CLI can save one through
# providers.update. A stored Runtime value wins on later starts. The selected
# FLAME_APIKEY value is a process-only fallback for this selected provider.
# Configure other providers through providers.update. Vendor-specific environment
# aliases are not read. providers.list reports effective credential provenance
# without exposing the secret.
apiKey: ""

# Optional API endpoint override. Empty = the adapter's built-in default.
# OpenAI-compatible endpoints normally include /v1; Azure OpenAI endpoints
# must end in /openai/v1; Anthropic-compatible endpoints name the origin or
# gateway prefix before the adapter-appended /v1. Overridden by FLAME_BASEURL.
baseURL: ""

# Tool-result eviction: a single tool output larger than this many bytes is
# offloaded out of the conversation (stored in SQLite) and replaced inline by a
# head+tail placeholder the model reads back on demand via the read_tool_result
# tool — so one giant file read or command dump stops re-inflating every later
# request. Enabled by default at 50000 bytes. Disable with the explicit enabled
# flag; threshold must remain positive. Both fields have FLAME_* overrides.
# toolResultOffload:
#   enabled: true
#   threshold: 50000

# Opt-in OS sandbox for the shell tool family. When enabled, each shell command
# runs in an in-place jail rooted at its working directory: only the workspace
# is writable, all networking is denied, the real $HOME is hidden, and the
# environment is scrubbed of inherited credentials. Off by default (a plain
# /bin/sh -c). Only macOS (Seatbelt) has a backend today — on any other host
# enabling it refuses startup (fail-closed) rather than running shells
# unconfined. readOnlyPaths re-opens toolchain roots under $HOME the build needs
# (e.g. a language toolchain or dependency cache). Overridable by
# FLAME_SANDBOX_SHELL.
# sandbox:
#   shell: false
#   readOnlyPaths:
#     - "~/go"
#     - "~/.cache"

# Runtime HTTP transport settings. Each is overridable by the matching
# FLAME_SERVER_* env var.
server:
  listen: 127.0.0.1:17171 # loopback endpoint for local protocol clients
  noLocalToken: false # true = disable the local-process gate (dev / same-origin)
  localTokenPath: "" # default: $FLAME_HOME/runtime/local-token
  # Empty uses the exact Wails + repository Vite origins built into the Runtime.
  # Add origins only for a different browser client; "*" is development-only.
  corsOrigins: []
  # Optional absolute path to apps/web/dist. Assets are public, while
  # /v2/rpc still requires the token. Overridden by FLAME_SERVER_WEBDIRECTORY.
  webDirectory: ""

# Code intelligence is provided by the installed flame.codeintel package.
# Configure its lsp-servers input and select flame.code-intelligence.v1.
