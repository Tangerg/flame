<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recorded tool result</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          13px/1.6 system-ui,
          sans-serif;
        color: light-dark(#20242b, #eef0f4);
        background: light-dark(#fafbfc, #181a1e);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      button,
      input {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid light-dark(#c9cfd9, #484e59);
        border-radius: 4px;
        padding: 4px 8px;
      }
      :focus-visible {
        outline: 2px solid light-dark(#265cad, #91baff);
        outline-offset: 2px;
      }
      #status {
        color: light-dark(#586170, #a3a8b2);
      }
      #status[role="alert"],
      .error {
        color: light-dark(#a62222, #ff9797);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
      }
      article {
        margin-block: 12px;
      }
      .row {
        padding-block: 4px;
        border-bottom: 1px solid light-dark(#e0e4e9, #373b43);
      }
      .location {
        font-family: monospace;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .number {
        color: light-dark(#586170, #a3a8b2);
        user-select: none;
        padding-right: 12px;
      }
      .line {
        display: grid;
        grid-template-columns: 4ch minmax(0, 1fr);
      }
      .negative {
        color: light-dark(#a62222, #ff9797);
      }
      .success {
        color: light-dark(#25692d, #9cdfa0);
      }
      .info,
      .accent {
        color: light-dark(#265cad, #91baff);
      }
      .muted {
        color: light-dark(#586170, #a3a8b2);
      }
      .bold {
        font-weight: bold;
      }
      .dim {
        opacity: 0.7;
      }
      .underline {
        text-decoration: underline;
      }
      .warning {
        color: light-dark(#795300, #ffe18d);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Recorded tool result</h1>
      <button id="refresh" disabled>Refresh recorded result</button>
      <label>Filter <input id="filter" type="search" /></label>
    </header>
    <p id="status" role="status">Waiting for the recorded result…</p>
    <article id="output" aria-label="Recorded result"></article>
    <button id="more" hidden>Show more matching rows</button>
    <script>
      const output = document.getElementById("output");
      const title = document.getElementById("title");
      const status = document.getElementById("status");
      const refresh = document.getElementById("refresh");
      const filter = document.getElementById("filter");
      const more = document.getElementById("more");
      let port;
      let pending = false;
      let tool;
      let visible = 40;
      const TONE_BY_SGR = {
        30: "muted",
        31: "negative",
        32: "success",
        33: "warning",
        34: "info",
        35: "accent",
        36: "info",
        37: "muted",
      };

      const CSI = /\u001b\[([0-9;?]*)([A-Za-z])/g;

      function applySgr(style, params) {
        const codes =
          params === ""
            ? [0]
            : params.split(";").map((p) => Number.parseInt(p, 10) || 0);
        let next = { ...style };
        for (let i = 0; i < codes.length; i += 1) {
          const code = codes[i];
          if (code === 0) next = {};
          else if (code === 1) next.bold = true;
          else if (code === 2) next.dim = true;
          else if (code === 4) next.underline = true;
          else if (code === 22) {
            next.bold = undefined;
            next.dim = undefined;
          } else if (code === 24) next.underline = undefined;
          else if (code === 39) next.tone = undefined;
          else if (code in TONE_BY_SGR) next.tone = TONE_BY_SGR[code];
          else if (code >= 90 && code <= 97) next.tone = TONE_BY_SGR[code - 60];
          else if (code === 38 || code === 48) i += codes[i + 1] === 5 ? 2 : 4;
        }
        return next;
      }

      function parseAnsi(input) {
        const spans = [];
        let style = {};
        let cursor = 0;

        const push = (text) => {
          if (text === "") return;
          const last = spans[spans.length - 1];
          if (
            last &&
            last.tone === style.tone &&
            last.bold === style.bold &&
            last.dim === style.dim &&
            last.underline === style.underline
          ) {
            last.text += text;
            return;
          }
          spans.push({ text, ...style });
        };

        CSI.lastIndex = 0;
        for (
          let match = CSI.exec(input);
          match !== null;
          match = CSI.exec(input)
        ) {
          push(input.slice(cursor, match.index));
          if (match[2] === "m") style = applySgr(style, match[1] ?? "");
          cursor = match.index + match[0].length;
        }
        push(input.slice(cursor));
        return spans;
      }

      function text(tag, value, className) {
        const node = document.createElement(tag);
        if (
          tag === "pre" &&
          typeof value === "string" &&
          value.includes("\u001b")
        ) {
          for (const part of parseAnsi(value)) {
            const span = document.createElement("span");
            span.textContent = part.text;
            if (part.tone) span.classList.add(part.tone);
            if (part.bold) span.classList.add("bold");
            if (part.dim) span.classList.add("dim");
            if (part.underline) span.classList.add("underline");
            node.append(span);
          }
        } else node.textContent = String(value ?? "");
        if (className) node.className = className;
        return node;
      }
      function record(value) {
        return value && typeof value === "object" && !Array.isArray(value)
          ? value
          : {};
      }
      function parsed(value) {
        try {
          return record(JSON.parse(value));
        } catch {
          return {};
        }
      }
      function rows() {
        const result = parsed(tool.result);
        if (tool.name === "read")
          return (tool.result ?? "")
            .replace(/\n$/, "")
            .split("\n")
            .map((body, index) => ({
              number: (tool.range?.start ?? 1) + index,
              body,
            }));
        if (Array.isArray(result.changes))
          return result.changes.map((change) => {
            const value = record(change);
            return {
              location: value.from
                ? `${value.from} → ${value.path}`
                : value.path,
              body: value.status ?? "changed",
            };
          });
        if (Array.isArray(result.hits))
          return result.hits.map((hit) => {
            const value = record(hit);
            return {
              location: `${value.path ?? ""}${value.lineNumber === undefined ? "" : `:${value.lineNumber}`}`,
              body: value.snippet ?? "",
            };
          });
        if (Array.isArray(result.results))
          return result.results.map((hit) => {
            const value = record(hit);
            return {
              location: `${value.title || value.url || ""}\n${value.url ?? ""}`,
              body: value.snippet ?? "",
            };
          });
        if (tool.name === "http_request" && typeof result.status === "number") {
          const headers = Object.entries(record(result.headers))
            .map(([key, value]) => `${key}: ${String(value)}`)
            .join("\n");
          return [
            {
              location: `${result.status} ${result.duration ?? ""}${result.truncated ? " · Truncated" : ""}`,
              body: `${headers}\n${result.body ?? ""}`,
            },
          ];
        }
        if (tool.name === "web_fetch" && typeof result.content === "string")
          return [{ location: result.format ?? "text", body: result.content }];
        if (tool.name === "list_skills") {
          const entries = [
            ...(tool.result ?? "").matchAll(
              /<skill>\s*<name>([\s\S]*?)<\/name>\s*<description>([\s\S]*?)<\/description>/g,
            ),
          ];
          if (entries.length)
            return entries.map((entry) => ({
              location: entry[1].trim(),
              body: entry[2].trim(),
            }));
        }
        if (tool.name === "ask_user") {
          const direct = result.answer ?? result.response;
          if (typeof direct === "string") return [{ body: direct }];
        }
        const value =
          typeof result.output === "string"
            ? result.output
            : (tool.result ?? "");
        return value.split("\n").map((body) => ({ body }));
      }
      function render() {
        if (!tool) return;
        const matching = rows().filter((row) =>
          `${row.location ?? ""}\n${row.body}`
            .toLowerCase()
            .includes(filter.value.toLowerCase()),
        );
        output.replaceChildren();
        for (const row of matching.slice(0, visible)) {
          const node = text("div", "", "row");
          if (row.location !== undefined)
            node.append(text("div", row.location, "location"));
          if (row.number !== undefined) {
            node.classList.add("line");
            node.append(text("span", row.number, "number"));
          }
          node.append(
            text(
              "pre",
              row.body || " ",
              /^error\b/.test(row.body)
                ? "error"
                : /^warning\b/.test(row.body)
                  ? "warning"
                  : undefined,
            ),
          );
          output.append(node);
        }
        more.hidden = matching.length <= visible;
        more.textContent = `Show ${Math.min(40, Math.max(0, matching.length - visible))} more matching rows`;
        if (!matching.length)
          output.append(text("p", "No matching recorded rows."));
      }
      function accept(value) {
        if (
          value?.format !== "flame.tool-result.v1" ||
          !value.tool ||
          value.tool.status === "running" ||
          typeof value.tool.result !== "string"
        ) {
          port.postMessage({
            type: "failure",
            reason: "Unsupported recorded result format.",
          });
          return;
        }
        tool = value.tool;
        title.textContent = tool.name;
        pending = false;
        refresh.disabled = false;
        status.setAttribute("role", "status");
        status.textContent = `${tool.status} · Recorded result${tool.error ? ` · ${tool.error}` : ""}`;
        render();
      }
      addEventListener("message", (event) => {
        if (
          event.source !== parent ||
          port ||
          event.data?.type !== "flame.view.connect.v3" ||
          !["light", "dark"].includes(event.data.theme?.scheme) ||
          event.ports.length !== 1
        )
          return;
        port = event.ports[0];
        port.onmessage = (message) => {
          if (message.data.type === "data" && pending)
            accept(message.data.data);
          if (message.data.type === "error" && pending) {
            pending = false;
            refresh.disabled = false;
            status.setAttribute("role", "alert");
            status.textContent = message.data.reason;
          }
        };
        port.start();
        accept(event.data.initial);
      });
      parent.postMessage("flame.view.ready.v3", "*");
      refresh.addEventListener("click", () => {
        if (!port || pending) return;
        pending = true;
        refresh.disabled = true;
        port.postMessage({ type: "read" });
      });
      filter.addEventListener("input", () => {
        visible = 40;
        render();
      });
      more.addEventListener("click", () => {
        visible += 40;
        render();
      });
    </script>
  </body>
</html>
