<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recorded tool result</title>
    <style>@layer base {
  *,
  ::before,
  ::after,
  ::backdrop {
    box-sizing: border-box;
    border: 0 solid;
    margin: 0;
    padding: 0;
  }

  html {
    color: var(--color-text);
    background-color: var(--color-bg);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-size: var(--fs-ui-md);
    font-weight: var(--fw-regular);
    line-height: var(--leading-body);
  }

  hr {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-size: inherit;
    font-weight: inherit;
  }

  a {
    color: inherit;
    text-decoration: inherit;
  }

  b,
  strong {
    font-weight: bolder;
  }

  code,
  kbd,
  samp,
  pre {
    font-family: var(--font-mono);
    font-size: 1em;
  }

  small {
    font-size: 80%;
  }

  sub,
  sup {
    position: relative;
    vertical-align: baseline;
    font-size: 75%;
    line-height: 0;
  }

  sub {
    bottom: -0.25em;
  }

  sup {
    top: -0.5em;
  }

  table {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }

  summary {
    display: list-item;
  }

  ol,
  ul,
  menu {
    list-style: none;
  }

  img,
  svg,
  video,
  canvas,
  audio,
  iframe,
  embed,
  object {
    display: block;
    vertical-align: middle;
  }

  img,
  video {
    max-width: 100%;
    height: auto;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 1;
    background-color: transparent;
    border-radius: 0;
  }

  button,
  input:where([type="button"], [type="reset"], [type="submit"]) {
    appearance: button;
  }
  ::placeholder {
    opacity: 1;
    color: color-mix(in oklab, currentcolor 50%, transparent);
  }

  textarea {
    resize: vertical;
  }

  [hidden]:where(:not([hidden="until-found"])) {
    display: none !important;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border-width: 0;
  }
}
html:not([data-pointer])
  :focus-visible:not([data-chrome-focus]):not([contenteditable]) {
  outline: 1.5px solid var(--color-focus-ring);
  outline-offset: 1px;
}
html[data-pointer] :focus-visible {
  outline: none;
}
html:not([data-pointer])
  :is([data-focus-inset]:focus-visible, [data-focus-inset] :focus-visible):not(
    [data-chrome-focus]
  ):not([contenteditable]) {
  outline-offset: -2px;
}
html:not([data-pointer]) [data-focus-proxy]:focus-within {
  outline: 1.5px solid var(--color-focus-ring);
  outline-offset: 1px;
}

.t-icon-swap {
  position: relative;
  display: inline-grid;
}
.t-icon-swap .t-icon {
  grid-area: 1 / 1;
  transition: opacity var(--dur-color) var(--ease-state);
}
.t-icon-swap .t-icon[data-glyph="rest"] {
  opacity: 1;
}
.t-icon-swap .t-icon[data-glyph="hover"] {
  opacity: 0;
}
:is(button, [role="button"]):not(:disabled):not(
    [aria-disabled="true"]
  ):focus-visible
  .t-icon-swap
  .t-icon[data-glyph="rest"] {
  opacity: 0;
}
:is(button, [role="button"]):not(:disabled):not(
    [aria-disabled="true"]
  ):focus-visible
  .t-icon-swap
  .t-icon[data-glyph="hover"] {
  opacity: 1;
}
@media (hover: hover) {
  :is(button, [role="button"]):not(:disabled):not([aria-disabled="true"]):hover
    .t-icon-swap
    .t-icon[data-glyph="rest"] {
    opacity: 0;
  }
  :is(button, [role="button"]):not(:disabled):not([aria-disabled="true"]):hover
    .t-icon-swap
    .t-icon[data-glyph="hover"] {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  [data-starting-style],
  [data-ending-style] {
    scale: none !important;
    translate: none !important;
  }
}
[data-slot="button"] svg:not([data-glyph="full"]) {
  opacity: var(--glyph-step);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
  }
}
html[data-flame-ui-theme-paint] * {
  transition: none !important;
}
@media (forced-colors: active) {
  :is(
    [role="dialog"],
    [role="alertdialog"],
    [role="menu"],
    [role="listbox"],
    [role="tooltip"]
  ) {
    border: var(--control-edge-width) solid CanvasText;
  }
}

    <script>
      const output = document.getElementById("output");
      const title = document.getElementById("title");
      const status = document.getElementById("status");
      const refresh = document.getElementById("refresh");
      const filter = document.getElementById("filter");
      const more = document.getElementById("more");
      let port;
      let pending = false;
      let tool;
      let visible = 40;
      const TONE_BY_SGR = {
        30: "muted",
        31: "negative",
        32: "success",
        33: "warning",
        34: "info",
        35: "accent",
        36: "info",
        37: "muted",
      };

      const CSI = /\u001b\[([0-9;?]*)([A-Za-z])/g;

      function applySgr(style, params) {
        const codes =
          params === ""
            ? [0]
            : params.split(";").map((p) => Number.parseInt(p, 10) || 0);
        let next = { ...style };
        for (let i = 0; i < codes.length; i += 1) {
          const code = codes[i];
          if (code === 0) next = {};
          else if (code === 1) next.bold = true;
          else if (code === 2) next.dim = true;
          else if (code === 4) next.underline = true;
          else if (code === 22) {
            next.bold = undefined;
            next.dim = undefined;
          } else if (code === 24) next.underline = undefined;
          else if (code === 39) next.tone = undefined;
          else if (code in TONE_BY_SGR) next.tone = TONE_BY_SGR[code];
          else if (code >= 90 && code <= 97) next.tone = TONE_BY_SGR[code - 60];
          else if (code === 38 || code === 48) i += codes[i + 1] === 5 ? 2 : 4;
        }
        return next;
      }

      function parseAnsi(input) {
        const spans = [];
        let style = {};
        let cursor = 0;

        const push = (text) => {
          if (text === "") return;
          const last = spans[spans.length - 1];
          if (
            last &&
            last.tone === style.tone &&
            last.bold === style.bold &&
            last.dim === style.dim &&
            last.underline === style.underline
          ) {
            last.text += text;
            return;
          }
          spans.push({ text, ...style });
        };

        CSI.lastIndex = 0;
        for (
          let match = CSI.exec(input);
          match !== null;
          match = CSI.exec(input)
        ) {
          push(input.slice(cursor, match.index));
          if (match[2] === "m") style = applySgr(style, match[1] ?? "");
          cursor = match.index + match[0].length;
        }
        push(input.slice(cursor));
        return spans;
      }

      function text(tag, value, className) {
        const node = document.createElement(tag);
        if (
          tag === "pre" &&
          typeof value === "string" &&
          value.includes("\u001b")
        ) {
          for (const part of parseAnsi(value)) {
            const span = document.createElement("span");
            span.textContent = part.text;
            if (part.tone) span.classList.add(part.tone);
            if (part.bold) span.classList.add("bold");
            if (part.dim) span.classList.add("dim");
            if (part.underline) span.classList.add("underline");
            node.append(span);
          }
        } else node.textContent = String(value ?? "");
        if (className) node.className = className;
        return node;
      }
      function record(value) {
        return value && typeof value === "object" && !Array.isArray(value)
          ? value
          : {};
      }
      function parsed(value) {
        try {
          return record(JSON.parse(value));
        } catch {
          return {};
        }
      }
      function rows() {
        const result = parsed(tool.result);
        if (tool.name === "read")
          return (tool.result ?? "")
            .replace(/\n$/, "")
            .split("\n")
            .map((body, index) => ({
              number: (tool.range?.start ?? 1) + index,
              body,
            }));
        if (Array.isArray(result.changes))
          return result.changes.map((change) => {
            const value = record(change);
            return {
              location: value.from
                ? `${value.from} → ${value.path}`
                : value.path,
              body: value.status ?? "changed",
            };
          });
        if (Array.isArray(result.hits))
          return result.hits.map((hit) => {
            const value = record(hit);
            return {
              location: `${value.path ?? ""}${value.lineNumber === undefined ? "" : `:${value.lineNumber}`}`,
              body: value.snippet ?? "",
            };
          });
        if (Array.isArray(result.results))
          return result.results.map((hit) => {
            const value = record(hit);
            return {
              location: `${value.title || value.url || ""}\n${value.url ?? ""}`,
              body: value.snippet ?? "",
            };
          });
        if (tool.name === "http_request" && typeof result.status === "number") {
          const headers = Object.entries(record(result.headers))
            .map(([key, value]) => `${key}: ${String(value)}`)
            .join("\n");
          return [
            {
              location: `${result.status} ${result.duration ?? ""}${result.truncated ? " · Truncated" : ""}`,
              body: `${headers}\n${result.body ?? ""}`,
            },
          ];
        }
        if (tool.name === "web_fetch" && typeof result.content === "string")
          return [{ location: result.format ?? "text", body: result.content }];
        if (tool.name === "list_skills") {
          const entries = [
            ...(tool.result ?? "").matchAll(
              /<skill>\s*<name>([\s\S]*?)<\/name>\s*<description>([\s\S]*?)<\/description>/g,
            ),
          ];
          if (entries.length)
            return entries.map((entry) => ({
              location: entry[1].trim(),
              body: entry[2].trim(),
            }));
        }
        if (tool.name === "ask_user") {
          const direct = result.answer ?? result.response;
          if (typeof direct === "string") return [{ body: direct }];
        }
        const value =
          typeof result.output === "string"
            ? result.output
            : (tool.result ?? "");
        return value.split("\n").map((body) => ({ body }));
      }
      function render() {
        if (!tool) return;
        const matching = rows().filter((row) =>
          `${row.location ?? ""}\n${row.body}`
            .toLowerCase()
            .includes(filter.value.toLowerCase()),
        );
        output.replaceChildren();
        for (const row of matching.slice(0, visible)) {
          const node = text("div", "", "row");
          if (row.location !== undefined)
            node.append(text("div", row.location, "location"));
          if (row.number !== undefined) {
            node.classList.add("line");
            node.append(text("span", row.number, "number"));
          }
          node.append(
            text(
              "pre",
              row.body || " ",
              /^error\b/.test(row.body)
                ? "error"
                : /^warning\b/.test(row.body)
                  ? "warning"
                  : undefined,
            ),
          );
          output.append(node);
        }
        more.hidden = matching.length <= visible;
        more.textContent = `Show ${Math.min(40, Math.max(0, matching.length - visible))} more matching rows`;
        if (!matching.length)
          output.append(
            text(
              "p",
              "No matching recorded rows. Clear the filter to see all results.",
            ),
          );
      }
      function accept(value) {
        if (
          value?.format !== "flame.tool-result.v1" ||
          !value.tool ||
          value.tool.status === "running" ||
          typeof value.tool.result !== "string"
        ) {
          port.postMessage({
            type: "failure",
            reason: "Unsupported recorded result format.",
          });
          return;
        }
        tool = value.tool;
        title.textContent = tool.name;
        pending = false;
        refresh.disabled = false;
        status.setAttribute("role", "status");
        status.textContent = `${tool.status} · Recorded result${tool.error ? ` · ${tool.error}` : ""}`;
        render();
      }
      addEventListener("message", (event) => {
        if (
          event.source !== parent ||
          port ||
          event.data?.type !== "flame.view.connect.v3" ||
          !["light", "dark"].includes(event.data.theme?.scheme) ||
          event.ports.length !== 1
        )
          return;
        port = event.ports[0];
        port.onmessage = (message) => {
          if (message.data.type === "data" && pending)
            accept(message.data.data);
          if (message.data.type === "error" && pending) {
            pending = false;
            refresh.disabled = false;
            status.setAttribute("role", "alert");
            status.textContent = message.data.reason;
          }
        };
        port.start();
        accept(event.data.initial);
      });
      parent.postMessage("flame.view.ready.v3", "*");
      refresh.addEventListener("click", () => {
        if (!port || pending) return;
        pending = true;
        refresh.disabled = true;
        port.postMessage({ type: "read" });
      });
      filter.addEventListener("input", () => {
        visible = 40;
        render();
      });
      more.addEventListener("click", () => {
        visible += 40;
        render();
      });
    </script>
  </body>
</html>
