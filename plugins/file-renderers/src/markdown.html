<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Captured Markdown file</title>
    <!-- UI_STYLES -->
    <style>
      #title {
        font-family: var(--font-mono);
      }
      body {
        padding: calc(var(--spacing) * 4);
        line-height: var(--leading-prose);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: calc(var(--spacing) * 3);
      }
      #status {
        margin-block-start: calc(var(--spacing) * 2);
      }
      #scope {
        margin-block-start: calc(var(--spacing) * 3);
      }
      #status,
      #scope {
        color: var(--color-text-muted);
        font-size: var(--fs-ui-sm);
      }
      #status[role="alert"] {
        color: var(--tone-negative);
      }
      main {
        overflow-wrap: anywhere;
        max-width: 75ch;
        margin-block: calc(var(--spacing) * 4);
      }
      main > * + * {
        margin-block-start: calc(var(--spacing) * 3);
      }
      main :is(h1, h2, h3, h4, h5, h6) {
        font-weight: var(--fw-semibold);
        line-height: 1.3;
        text-wrap: balance;
      }
      main p {
        text-wrap: pretty;
      }
      main :is(ol, ul) {
        padding-inline-start: calc(var(--spacing) * 5);
      }
      main ol {
        list-style: decimal;
      }
      main ul {
        list-style: disc;
      }
      pre {
        border-radius: var(--field-radius);
      }

      main h1 {
        font-size: var(--fs-display-md);
      }
      main h2 {
        font-size: var(--fs-display-sm);
      }
      main h3 {
        font-size: var(--fs-ui-md);
      }
      main h4,
      main h5,
      main h6 {
        font-size: var(--fs-ui-md);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: calc(var(--spacing) * 3);
        background: var(--color-sunken);
      }
      code {
        font-family: var(--font-mono);
      }
      blockquote {
        margin-inline: 0;
        padding-inline: calc(var(--spacing) * 3);
        border-inline-start: 3px solid var(--color-border-soft);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: start;
        border: 1px solid var(--color-border-soft);
        padding: calc(var(--spacing) * 2);
      }
      .reference {
        color: var(--color-text-muted);
        font-size: var(--fs-ui-sm);
      }
    </style>
  </head>
  <body>
    <header>
      <!-- TITLE -->
      <!-- REFRESH -->
    </header>
    <p id="scope"></p>
    <p id="status" role="status">Waiting for the captured file…</p>
    <main id="output" aria-label="Captured Markdown content"></main>
    <!-- SCRIPT -->
  </body>
</html>
