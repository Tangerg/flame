<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flame Issue approval</title>
  <link rel="stylesheet" href="/flame/team/app.css" />
  <script type="module" src="/flame/team/app.js"></script>
  <main>
    <h1 id="title">Flame Issue approval</h1>
    <p id="status" role="status" aria-live="polite">Checking access…</p>
    <a id="source" hidden rel="noreferrer">Open original GitHub Issue</a>
    <section id="evidence" hidden aria-labelledby="verification">
      <h2 id="verification">Verification</h2>
      <p id="head"></p>
      <details>
        <summary>Project checks and CI</summary>
        <pre id="checks"></pre>
      </details>
      <pre id="report"></pre>
      <a id="receipt" hidden rel="noreferrer">Open publication receipt</a>
    </section>
    <button type="button" id="approve" hidden>
      Approve and publish to GitHub
    </button>
    <noscript>Open this invitation with JavaScript enabled.</noscript>
  </main>
</html>
