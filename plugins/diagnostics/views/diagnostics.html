<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Client diagnostics</title>
  <style>
    :root {
      font: 14px system-ui;
      color-scheme: light dark;
    }
    body {
      margin: 20px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 20px;
    }
    button,
    select {
      font: inherit;
      padding: 6px 10px;
    }
    #status {
      opacity: 0.75;
    }
    #output {
      display: grid;
      gap: 10px;
    }
    article {
      border: 1px solid;
      border-color: light-dark(#ddd, #444);
      border-radius: 6px;
      padding: 12px;
    }
    summary {
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
    table {
      border-collapse: collapse;
    }
    th,
    td {
      padding: 5px 14px 5px 0;
      text-align: left;
    }
    .error {
      color: light-dark(#b42318, #ffa69e);
    }
  </style>
  <header>
    <h1>Client diagnostics</h1>
    <select id="signal" aria-label="Telemetry signal">
      <option value="spans">Traces</option>
      <option value="metrics">Metrics</option>
      <option value="logs">Logs</option>
    </select>
    <button id="refresh" disabled>Refresh</button>
  </header>
  <p>
    Local observations from the current graphical client. Runtime accounting and
    remote Runtime telemetry are separate facts.
  </p>
  <p id="status" role="status">Connecting…</p>
  <main id="output"></main>
  <script>
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const refresh = document.getElementById("refresh");
    const signal = document.getElementById("signal");
    let port, snapshot;
    let pending = false;
    function node(tag, text) {
      const element = document.createElement(tag);
      if (text !== undefined) element.textContent = text;
      return element;
    }
    function render() {
      const section = snapshot[signal.value];
      const fragment = document.createDocumentFragment();
      for (const row of section.rows) {
        const article = node("article");
        const detail = node("details");
        const label =
          signal.value === "spans"
            ? `${row.name} · ${row.durationMillis} ms · ${row.status}`
            : signal.value === "logs"
              ? `${row.severity} · ${row.body}`
              : `${row.name} [${row.kind}]`;
        const summary = node("summary", label);
        if (row.status === "error" || row.severity === "ERROR")
          summary.className = "error";
        detail.append(summary);
        if (signal.value === "metrics") {
          const table = node("table");
          for (const key of ["count", "sum", "p50", "p95", "avg"]) {
            if (row[key] === undefined) continue;
            const line = node("tr");
            line.append(
              node("th", key),
              node("td", `${row[key]}${row.unit ? ` ${row.unit}` : ""}`),
            );
            table.append(line);
          }
          detail.append(table);
        }
        detail.append(node("pre", JSON.stringify(row, null, 2)));
        article.append(detail);
        fragment.append(article);
      }
      if (!section.rows.length)
        fragment.append(node("p", "No local observations in this read."));
      output.replaceChildren(fragment);
      status.setAttribute("role", "status");
      status.textContent = `${section.rows.length} observations shown; ${section.omittedFromRead} omitted from the current buffer read. Older observations may already have left the bounded client buffer.`;
    }
    function accept(value) {
      if (
        value?.format !== "flame.client-diagnostics.v1" ||
        value.source !== "currentClient" ||
        !["spans", "metrics", "logs"].every(
          (key) =>
            Array.isArray(value[key]?.rows) &&
            Number.isSafeInteger(value[key]?.omittedFromRead) &&
            value[key].omittedFromRead >= 0,
        )
      ) {
        port.postMessage({
          type: "failure",
          reason: "Unsupported current-client diagnostics format.",
        });
        return;
      }
      snapshot = value;
      try {
        render();
      } catch {
        port.postMessage({
          type: "failure",
          reason: "The local observations could not be displayed.",
        });
        return;
      }
      pending = false;
      refresh.disabled = false;
    }
    addEventListener("message", (event) => {
      if (
        event.source !== parent ||
        port ||
        event.data?.type !== "flame.view.connect.v2" ||
        !["light", "dark"].includes(event.data.scheme) ||
        event.ports.length !== 1
      )
        return;
      document.documentElement.style.colorScheme = event.data.scheme;
      port = event.ports[0];
      port.onmessage = (message) => {
        if (message.data.type === "data" && pending) accept(message.data.data);
        if (message.data.type === "error" && pending) {
          pending = false;
          refresh.disabled = false;
          status.setAttribute("role", "alert");
          status.textContent = message.data.reason;
        }
      };
      port.start();
      accept(event.data.initial);
    });
    parent.postMessage("flame.view.ready.v2", "*");
    signal.addEventListener("change", () => {
      if (snapshot) render();
    });
    refresh.addEventListener("click", () => {
      if (!port || pending) return;
      pending = true;
      refresh.disabled = true;
      port.postMessage({ type: "read" });
    });
  </script>
</html>
