<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schedules</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.6 system-ui,
          sans-serif;
        color: light-dark(#20242b, #eef0f4);
        background: light-dark(#fafbfc, #181a1e);
        --muted: light-dark(#586170, #a3a8b2);
        --surface: light-dark(#eef1f5, #24282e);
        --edge: light-dark(#c9cfd9, #484e59);
        --accent: light-dark(#265cad, #91baff);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        color: var(--muted);
      }
      header,
      .filters,
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 7px 12px;
        max-width: 100%;
      }
      button:disabled {
        opacity: 0.5;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .filters {
        justify-content: start;
        margin: 20px 0;
      }
      article {
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 16px;
        margin: 12px 0;
        overflow-wrap: anywhere;
      }
      article p {
        color: inherit;
        white-space: pre-wrap;
      }
      small {
        color: var(--muted);
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        font-size: 12px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
      }
      #status[role="alert"] {
        color: light-dark(#a62222, #ff9797);
      }
      @media (max-width: 480px) {
        body {
          padding: 16px;
        }
        dl {
          display: block;
        }
        dd {
          margin-bottom: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Schedules</h1>
      <button id="refresh">Refresh</button>
    </header>
    <p>
      Inspect saved instructions and Runtime-reported firing times. Create and
      manage schedules with the controls above. Cron uses UTC unless an
      expression names a timezone. Disabling or deleting stops future claims; an
      already claimed occurrence may still start.
    </p>
    <p id="summary"></p>
    <div class="filters">
      <input
        id="search"
        type="search"
        aria-label="Search this page"
        placeholder="Search this page"
      /><select id="state" aria-label="Schedule status">
        <option value="">All schedules</option>
        <option value="enabled">Enabled</option>
        <option value="disabled">Disabled</option>
      </select>
    </div>
    <p id="status" role="status">Waiting for the trusted Host…</p>
    <main id="items"></main>
    <nav>
      <button id="previous">Previous page</button
      ><button id="next">Next page</button>
    </nav>
    <script>
      const refresh = document.getElementById("refresh"),
        previous = document.getElementById("previous"),
        next = document.getElementById("next"),
        search = document.getElementById("search"),
        state = document.getElementById("state"),
        status = document.getElementById("status"),
        summary = document.getElementById("summary"),
        items = document.getElementById("items");
      let port,
        rows = [],
        history = [],
        nextCursor,
        pending;
      function controls() {
        refresh.disabled = Boolean(pending);
        previous.disabled = Boolean(pending) || history.length === 0;
        next.disabled = Boolean(pending) || !nextCursor;
      }
      function text(tag, value) {
        const element = document.createElement(tag);
        element.textContent = value;
        return element;
      }
      function render() {
        items.replaceChildren();
        const matching = rows.filter(
          (item) =>
            (!state.value ||
              (item.enabled ? "enabled" : "disabled") === state.value) &&
            `${item.id} ${item.title} ${item.instructions} ${item.cron} ${item.workspace?.path ?? ""}`
              .toLocaleLowerCase()
              .includes(search.value.toLocaleLowerCase()),
        );
        summary.textContent = `${rows.filter((item) => item.enabled).length} enabled · ${rows.filter((item) => !item.enabled).length} disabled on this page`;
        if (!matching.length)
          items.append(
            text(
              "p",
              rows.length
                ? "No matching schedules on this page."
                : "No schedules saved.",
            ),
          );
        for (const item of matching) {
          const article = document.createElement("article");
          article.dataset.scheduleId = item.id;
          article.append(
            text("strong", item.title || "Untitled schedule"),
            text("p", item.instructions),
          );
          const facts = document.createElement("dl");
          for (const [label, value] of [
            ["Schedule", item.id],
            ["Revision", String(item.revision)],
            ["Status", item.enabled ? "Enabled" : "Disabled"],
            ["Cron", item.cron],
            ["Workspace", item.workspace?.path ?? "Runtime default"],
            [
              "Model",
              item.provider && item.model
                ? `${item.provider}/${item.model}`
                : "Runtime default",
            ],
            ["Reasoning effort", item.reasoningEffort],
            ["Next firing", item.nextRunAt ?? "Not scheduled"],
            ["Last firing", item.lastRunAt ?? "Never fired"],
            ["Created", item.createdAt],
          ])
            if (value !== undefined)
              facts.append(text("dt", label), text("dd", value));
          article.append(facts);
          items.append(article);
        }
      }
      function accept(page) {
        rows = page.data;
        nextCursor = page.nextCursor;
        history = pending?.history ?? [];
        pending = undefined;
        render();
        controls();
        status.setAttribute("role", "status");
        status.textContent = `${rows.length} schedules loaded on this page.`;
      }
      function read(targetHistory) {
        if (pending || !port) return;
        const cursor = targetHistory.at(-1);
        pending = { history: targetHistory };
        controls();
        status.setAttribute("role", "status");
        status.textContent = "Reading schedules…";
        port.postMessage({ type: "read", ...(cursor ? { cursor } : {}) });
      }
      addEventListener("message", (event) => {
        if (
          event.source !== parent ||
          port ||
          event.data?.type !== "flame.view.connect.v2" ||
          !["light", "dark"].includes(event.data.scheme) ||
          event.ports.length !== 1
        )
          return;
        document.documentElement.style.colorScheme = event.data.scheme;
        port = event.ports[0];
        port.onmessage = (message) => {
          if (message.data.type === "data" && pending)
            accept(message.data.data);
          if (message.data.type === "error" && pending) {
            pending = undefined;
            controls();
            status.setAttribute("role", "alert");
            status.textContent = message.data.reason;
          }
        };
        port.start();
        accept(event.data.initial);
      });
      parent.postMessage("flame.view.ready.v2", "*");
      refresh.addEventListener("click", () => read([]));
      previous.addEventListener("click", () => read(history.slice(0, -1)));
      next.addEventListener("click", () => read([...history, nextCursor]));
      for (const control of [search, state])
        control.addEventListener("input", render);
      controls();
    </script>
  </body>
</html>
