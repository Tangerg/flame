# Flame CLI preferences.
#
# For one project:
#   cp config/config.example.yaml .flame.yaml
#
# Without .flame.yaml in the selected workspace (`.` or `-C`), Flame reads
# config.yaml from the OS user config directory under flame/. FLAME_CLI_*
# environment variables and CLI flags override file values. `flame config path`
# shows the selected file and `flame config show` prints the merged, validated
# result.
# CLI configuration must be a regular YAML file no larger than 256 KiB.
#
# This file configures the CLI consumer only. Provider credentials, custom
# endpoints, utility/embedding roles, Runtime server, sandbox, MCP, and LSP are
# Runtime-owned settings; inspect or change them from the interactive CLI with
# /providers, /provider-config, and the related Runtime commands.

# Omit provider/model to inherit the active Session's durable selection. To
# override it for new Runs, set one exact pair; the fields move together.
# provider: deepseek
# model: deepseek-v4-flash

# Omit a limit for unlimited. Every configured value must be strictly positive.
# run:
#   max-total-tokens: 200000
#   max-steps: 100
#   max-budget-usd: 2.50

# Default scope offered after approving a tool. The choices are:
# none | session | project | global
approval:
  remember: none

ui:
  mouse: true
  notifications: true
  tool-details: false
  transcript-retain: 24       # 4..500 finished transcript blocks
  reconnect-attempts: 4       # 0..20 dropped-stream reconnect attempts

# Omit this block to use ~/.flame/plugins. Paths must be non-empty and unique;
# each directory may contain at most 1024 immediate entries.
# plugins:
#   directories:
#     - /absolute/path/to/plugins

# Override only the actions you want to change; defaults fill the rest.
# Run /shortcuts in the interactive CLI to inspect the complete current map.
# keys:
#   command-palette: [ctrl+p]
#   sessions: [ctrl+r]
#   external-editor: [ctrl+e]
