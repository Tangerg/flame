name: Check
on:
  push:
  pull_request:
env:
  NODE_VERSION: 22.22.1
  NPM_VERSION: 11.21.1
jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@"$NPM_VERSION"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles bubblewrap util-linux libreoffice poppler-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL \
            --ro-bind / / --proc /proc --remount-ro /proc -- /bin/true
          echo "FLAME_DELIVERABLES_OFFICE=/usr/bin/libreoffice" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFINFO=/usr/bin/pdfinfo" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOPPM=/usr/bin/pdftoppm" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOTEXT=/usr/bin/pdftotext" >> "$GITHUB_ENV"
      - name: Install macOS renderers
        if: runner.os == 'macOS'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/MacPorts.pkg" \
            https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
          echo "87b2e87ed7adc4aca947b42eb7ff991614cc0edfccb486237f2bbc75f28aae63  $RUNNER_TEMP/MacPorts.pkg" | shasum -a 256 --check
          sudo installer -pkg "$RUNNER_TEMP/MacPorts.pkg" -target /
          sudo /opt/local/bin/port -N -b install poppler
          office_executable=$(node tooling/office-toolchain.mjs --output "$GITHUB_WORKSPACE/out/toolchains")
          office_root=$(dirname "$(dirname "$office_executable")")
          echo "FLAME_DELIVERABLES_OFFICE=$office_executable" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFINFO=/opt/local/bin/pdfinfo" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOPPM=/opt/local/bin/pdftoppm" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOTEXT=/opt/local/bin/pdftotext" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_TOOL_ROOTS=[\"$office_root\",\"/opt/local\"]" >> "$GITHUB_ENV"
      - run: make setup
      - name: Qualify native deliverables
        run: node plugins/scripts/test-backends.mjs
        env:
          FLAME_DELIVERABLES_NATIVE_TESTS: "1"
          TMPDIR: /tmp
      - run: make check
        env:
          FLAME_DELIVERABLES_NATIVE_TESTS: "1"
      - if: runner.os == 'macOS'
        run: make check-author
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@"$NPM_VERSION"
      - run: make setup
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(cd apps/desktop && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
      - run: make check-native
