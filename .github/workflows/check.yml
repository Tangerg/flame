name: Check
on:
  push:
  pull_request:
jobs:
  workspace:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: make setup
      - run: make check
      - run: make check-author
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: make setup
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(cd apps/desktop && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
      - run: make check-native
