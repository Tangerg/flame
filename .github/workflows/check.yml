name: Check
on:
  push:
  pull_request:
env:
  NODE_VERSION: 22.22.1
  NPM_VERSION: 11.21.1
jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@"$NPM_VERSION"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux libreoffice poppler-utils
          echo "FLAME_DELIVERABLES_OFFICE=/usr/lib/libreoffice/program/soffice.bin" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFINFO=/usr/bin/pdfinfo" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOPPM=/usr/bin/pdftoppm" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOTEXT=/usr/bin/pdftotext" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: |
          brew install poppler
          brew install --cask libreoffice
          echo "FLAME_DELIVERABLES_OFFICE=/Applications/LibreOffice.app/Contents/MacOS/soffice" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFINFO=$(brew --prefix poppler)/bin/pdfinfo" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOPPM=$(brew --prefix poppler)/bin/pdftoppm" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_PDFTOTEXT=$(brew --prefix poppler)/bin/pdftotext" >> "$GITHUB_ENV"
          echo "FLAME_DELIVERABLES_TOOL_ROOTS=[\"/Applications/LibreOffice.app\",\"$(brew --cellar)\"]" >> "$GITHUB_ENV"
      - run: make setup
      - run: make check
        env:
          FLAME_DELIVERABLES_NATIVE_TESTS: "1"
      - if: runner.os == 'macOS'
        run: make check-author
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@"$NPM_VERSION"
      - run: make setup
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(cd apps/desktop && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
      - run: make check-native
