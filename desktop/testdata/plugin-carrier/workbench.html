<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Trusted Wails workbench</title>
  </head>
  <body>
    <h1>Trusted Wails workbench</h1>
    <script type="module">
      import { Call } from "/wails/runtime.js";
      try {
        await Call.ByName("main.Probe.Touch");
        await Call.ByName("main.Probe.Begin");
        window.webkit.messageHandlers.external.postMessage(
          "carrier-workbench-ready",
        );
      } catch (error) {
        window.webkit.messageHandlers.external.postMessage(
          "carrier-result:" + JSON.stringify({ error: String(error) }),
        );
      }
    </script>
  </body>
</html>
