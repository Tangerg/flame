<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'self' wails:; style-src 'unsafe-inline'; connect-src 'self'; frame-src __CARRIER_FRAME_SOURCE__ blob:; base-uri 'none'; form-action 'none'"
    />
    <title>Plugin carrier probe</title>
  </head>
  <body>
    <h1>Plugin carrier probe</h1>
    <pre id="result">Running</pre>
    <script>
      const pause = (milliseconds) =>
        new Promise((resolve) => setTimeout(resolve, milliseconds));
      const wails = location.protocol === "wails:";
      const childPolicy = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">`;

      function createFrame(title, program, input, signal) {
        const frame = document.createElement("iframe");
        frame.title = title;
        frame.sandbox = "allow-scripts";
        const content = `${childPolicy}<script>
          const fail = (error) => parent.postMessage({ type: "carrier-error", error: String(error) }, "*");
          addEventListener("error", (event) => fail(event.message));
          addEventListener("unhandledrejection", (event) => fail(event.reason));
          (${program})(${JSON.stringify(input)});
        <\/script>`;
        frame.addEventListener(
          "load",
          () =>
            frame.contentWindow.postMessage(
              { type: "carrier-content", content },
              "*",
            ),
          { once: true, signal },
        );
        const entry = new URL("frame.html", location.href);
        const policy = new URL(location.href).searchParams.get(
          "carrier-policy",
        );
        if (policy !== null) entry.searchParams.set("carrier-policy", policy);
        frame.src = entry.href;
        return frame;
      }

      async function probeBoundary({ escapeURL, leakURL, iceEndpoint }) {
        const attempt = (operation) => {
          try {
            operation();
            return true;
          } catch (error) {
            if (error.name !== "SecurityError") throw error;
            return false;
          }
        };
        const observations = {
          origin: "forged-origin",
          parentDOM: attempt(() => parent.document.body.innerHTML),
          parentStorage: attempt(() => parent.localStorage.length),
          storage: attempt(() => localStorage.length),
          cookieCanary:
            attempt(() => document.cookie) &&
            document.cookie.includes("flame_carrier_cookie=fixture"),
          topNavigation: attempt(() => (top.location.href = escapeURL)),
          popup: window.open(escapeURL) !== null,
          nativeHandler:
            typeof window.webkit?.messageHandlers?.external?.postMessage ===
            "function",
          carrierHandler:
            typeof window.webkit?.messageHandlers?.carrier?.postMessage ===
            "function",
          wailsGlobal: typeof window._wails !== "undefined",
        };
        if (observations.nativeHandler) {
          window.webkit.messageHandlers.external.postMessage("carrier-witness");
          window.webkit.messageHandlers.external.postMessage(
            "wails:runtime:ready",
          );
        }
        if (observations.carrierHandler)
          window.webkit.messageHandlers.carrier.postMessage(
            "wails:runtime:ready",
          );
        let port;
        addEventListener("message", (event) => {
          if (event.source !== parent) return;
          if (event.data === "carrier-channel" && event.ports.length === 1) {
            if (port) throw new Error("the frame channel is already bound");
            port = event.ports[0];
            port.onmessage = (message) => {
              if (message.data === "ping") port.postMessage("pong");
            };
            port.start();
            port.postMessage("connected");
          }
          if (event.data === "carrier-retired") {
            port.postMessage("after-close");
            parent.postMessage({ type: "carrier-retired" }, "*");
          }
        });
        let witness;
        const blockedNetwork = new Promise((resolve) => {
          witness = (event) => {
            if (
              event.isTrusted &&
              event.disposition === "enforce" &&
              event.effectiveDirective === "connect-src" &&
              event.blockedURI === leakURL
            )
              resolve(event.effectiveDirective);
          };
          addEventListener("securitypolicyviolation", witness);
        });
        const image = new Image();
        image.src = leakURL;
        try {
          await fetch(leakURL);
          observations.network = { read: true };
        } catch (error) {
          if (!(error instanceof TypeError)) throw error;
          observations.network = {
            read: false,
            blockedDirective: await blockedNetwork,
          };
        } finally {
          removeEventListener("securitypolicyviolation", witness);
        }
        if (!iceEndpoint)
          throw new Error("the trusted host must supply an ICE probe endpoint");
        observations.peer = {
          available: typeof RTCPeerConnection === "function",
          attempted: false,
          candidates: 0,
          policyEnforced: false,
        };
        if (observations.peer.available) {
          const observer = new ReportingObserver(
            (reports) => {
              try {
                for (const report of reports) {
                  const encoded =
                    Object.getPrototypeOf(report).toJSON.call(report);
                  if (
                    encoded.type === "connection-allowlist" &&
                    encoded.body.connection === "webrtc" &&
                    encoded.body.disposition === "enforce"
                  )
                    observations.peer.policyEnforced = true;
                }
              } catch (error) {
                parent.postMessage(
                  { type: "carrier-error", error: String(error) },
                  "*",
                );
              }
            },
            { types: ["connection-allowlist"], buffered: true },
          );
          observer.observe();
          const peer = new RTCPeerConnection({
            iceServers: [{ urls: iceEndpoint }],
          });
          peer.onicecandidate = (event) => {
            if (event.candidate) observations.peer.candidates++;
          };
          try {
            peer.createDataChannel("carrier-peer");
            await peer.setLocalDescription();
            const remoteSDP = peer.localDescription.sdp
              .replaceAll("a=setup:actpass", "a=setup:active")
              .replace(/a=ice-ufrag:[^\r\n]+/g, "a=ice-ufrag:carrierRemote")
              .replace(
                /a=ice-pwd:[^\r\n]+/g,
                "a=ice-pwd:carrierRemote01234567890123456789",
              );
            await peer.setRemoteDescription({ type: "answer", sdp: remoteSDP });
            const port = Number(
              iceEndpoint.slice(iceEndpoint.lastIndexOf(":") + 1),
            );
            await peer.addIceCandidate({
              candidate: `candidate:carrier 1 udp 2130706431 127.0.0.1 ${port} typ host`,
              sdpMid: peer.localDescription.sdp.match(/a=mid:([^\r\n]+)/)[1],
            });
            observations.peer.attempted = true;
            await new Promise((resolve) => setTimeout(resolve, 600));
          } finally {
            peer.close();
            observer.disconnect();
          }
        }
        parent.postMessage({ type: "carrier-child", observations }, "*");
      }

      function probeNavigation({ target }) {
        addEventListener("message", (event) => {
          if (event.source !== parent || event.data?.type !== "navigate")
            return;
          parent.postMessage({ type: "carrier-navigation" }, "*");
          location.href = target;
        });
        parent.postMessage({ type: "carrier-navigation-ready" }, "*");
      }

      function waitFor(target, type, accepts, signal, start) {
        return new Promise((resolve, reject) => {
          const cleanup = () => {
            target.removeEventListener(type, listener);
            signal.removeEventListener("abort", aborted);
          };
          const fail = (error) => {
            cleanup();
            reject(error);
          };
          const listener = (event) => {
            try {
              if (!accepts(event)) return;
              cleanup();
              resolve(event);
            } catch (error) {
              fail(error);
            }
          };
          const aborted = () => fail(signal.reason);
          target.addEventListener(type, listener);
          signal.addEventListener("abort", aborted, { once: true });
          if (signal.aborted) {
            aborted();
            return;
          }
          try {
            start?.();
          } catch (error) {
            fail(error);
          }
        });
      }

      const fromFrame = (frame, type, signal, start) =>
        waitFor(
          window,
          "message",
          (event) =>
            event.source !== null &&
            event.source === frame.contentWindow &&
            event.data?.type === type,
          signal,
          start,
        );

      const bindingURL = (method, callID = crypto.randomUUID()) => {
        const query = new URLSearchParams({
          object: "0",
          method: "0",
          args: JSON.stringify({
            "call-id": callID,
            methodName: `main.Probe.${method}`,
            args: [],
          }),
        });
        return `/wails/runtime?${query}`;
      };
      const invoke = async (method, signal) => {
        const response = await fetch(bindingURL(method), { signal });
        if (!response.ok)
          throw new Error(`native positive control failed: ${response.status}`);
        return response.json();
      };

      async function run() {
        const result = { wails, hostOrigin: location.origin };
        const lifetime = new AbortController();
        const { signal } = lifetime;
        let frame;
        let navigationFrame;
        let channel;
        const deadline = setTimeout(
          () => lifetime.abort(new Error("carrier probe timed out")),
          10_000,
        );
        try {
          let nativeBaseline;
          if (wails) {
            window.webkit.messageHandlers.external.postMessage(
              "wails:runtime:ready",
            );
            await invoke("Touch", signal);
            nativeBaseline = await invoke("Begin", signal);
          }
          const iceEndpoint = wails
            ? nativeBaseline.peerEndpoint
            : new URL(location.href).searchParams.get("carrier-stun");
          frame = createFrame(
            "Untrusted plugin probe",
            probeBoundary,
            {
              escapeURL: new URL("/carrier-escape", location.href).href,
              leakURL: new URL("/carrier-leak", location.href).href,
              iceEndpoint,
            },
            signal,
          );
          const navigationTarget = new URL(
            wails
              ? bindingURL("Touch", "carrier-child")
              : "/carrier-navigation",
            location.href,
          ).href;
          navigationFrame = createFrame(
            "Untrusted navigation probe",
            probeNavigation,
            {
              target: navigationTarget,
            },
            signal,
          );
          addEventListener(
            "message",
            (event) => {
              if (
                event.source !== null &&
                event.data?.type === "carrier-error" &&
                (event.source === frame.contentWindow ||
                  event.source === navigationFrame.contentWindow)
              )
                lifetime.abort(new Error(event.data.error));
            },
            { signal },
          );
          const bootstrap = await fromFrame(
            frame,
            "carrier-child",
            signal,
            () => {
              window.postMessage(
                { type: "carrier-child", observations: {} },
                "*",
              );
              document.body.append(frame);
            },
          );
          result.frame = {
            origin: bootstrap.origin,
            observations: bootstrap.data.observations,
          };
          channel = new MessageChannel();
          let received = 0;
          channel.port1.addEventListener("message", () => received++, {
            signal,
          });
          await waitFor(
            channel.port1,
            "message",
            (event) => event.data === "connected",
            signal,
            () => {
              channel.port1.start();
              frame.contentWindow.postMessage("carrier-channel", "*", [
                channel.port2,
              ]);
            },
          );
          await waitFor(
            channel.port1,
            "message",
            (event) => event.data === "pong",
            signal,
            () => channel.port1.postMessage("ping"),
          );
          const beforeClose = received;
          const retirement = await fromFrame(
            frame,
            "carrier-retired",
            signal,
            () => {
              channel.port1.close();
              frame.contentWindow.postMessage("carrier-retired", "*");
            },
          );
          await pause(100);
          signal.throwIfAborted();
          result.channel = {
            receivedBeforeClose: beforeClose,
            receivedAfterClose: received,
            retirementOrigin: retirement.origin,
          };
          frame.remove();

          await fromFrame(
            navigationFrame,
            "carrier-navigation-ready",
            signal,
            () => document.body.append(navigationFrame),
          );
          const navigationAttempt = fromFrame(
            navigationFrame,
            "carrier-navigation",
            signal,
          );
          const navigationBlocked = waitFor(
            window,
            "securitypolicyviolation",
            (event) =>
              event.isTrusted &&
              event.disposition === "enforce" &&
              event.effectiveDirective === "frame-src" &&
              event.blockedURI === navigationTarget,
            signal,
            () =>
              navigationFrame.contentWindow.postMessage(
                { type: "navigate" },
                "*",
              ),
          );
          const [attempt, blocked] = await Promise.all([
            navigationAttempt,
            navigationBlocked,
          ]);
          result.navigation = {
            origin: attempt.origin,
            blockedDirective: blocked.effectiveDirective,
          };
          return result;
        } finally {
          clearTimeout(deadline);
          lifetime.abort();
          channel?.port1.close();
          channel?.port2.close();
          frame?.remove();
          navigationFrame?.remove();
        }
      }

      window.addEventListener(
        "load",
        async () => {
          let encoded;
          try {
            encoded = JSON.stringify(await run());
          } catch (error) {
            encoded = JSON.stringify({ error: String(error) });
          }
          document.getElementById("result").textContent = encoded;
          if (wails)
            window.webkit.messageHandlers.external.postMessage(
              "carrier-result:" + encoded,
            );
          window.carrierResult = JSON.parse(encoded);
        },
        { once: true },
      );
    </script>
  </body>
</html>
