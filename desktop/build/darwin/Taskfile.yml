version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  check:plugin-carrier:
    summary: Verifies third-party frame isolation in the shipping Wails carrier
    cmds:
      - node frontend/scripts/check-plugin-carrier-native.mjs '-macos={{.MACOS_MIN_VERSION}} -extldflags=-mmacosx-version-min={{.MACOS_MIN_VERSION}}' wails
    env: &carrierEnvironment
      CGO_ENABLED: 1
      CGO_CFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      MACOSX_DEPLOYMENT_TARGET: "{{.MACOS_MIN_VERSION}}"

  check:plugin-carrier:isolated:
    summary: Verifies an independent WebKit carrier inside the shipping Wails window
    cmds:
      - node frontend/scripts/check-plugin-carrier-native.mjs '-macos={{.MACOS_MIN_VERSION}} -extldflags=-mmacosx-version-min={{.MACOS_MIN_VERSION}}' isolated-webkit
    env: *carrierEnvironment

  check:plugin-view:
    summary: Verifies the production native plugin surface and retirement
    cmds:
      - node frontend/scripts/check-plugin-view-native.mjs '-macos={{.MACOS_MIN_VERSION}} -extldflags=-mmacosx-version-min={{.MACOS_MIN_VERSION}}'
    env: *carrierEnvironment

  check:plugin-view:remote:
    summary: Verifies native plugin pages against an explicitly configured remote Runtime
    cmds:
      - node frontend/scripts/check-plugin-runtime-native.mjs '-macos={{.MACOS_MIN_VERSION}} -extldflags=-mmacosx-version-min={{.MACOS_MIN_VERSION}}'
    env: *carrierEnvironment

  build:
    summary: Builds the application
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.NATIVE_BIN}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:work:sync
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false{{end}} -ldflags="{{if ne .DEV "true"}}-w -s {{end}}-macos={{.MACOS_MIN_VERSION}} -extldflags=-mmacosx-version-min={{.MACOS_MIN_VERSION}}"'
      DEFAULT_OUTPUT: '{{.NATIVE_BIN}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      MACOSX_DEPLOYMENT_TARGET: "{{.MACOS_MIN_VERSION}}"


  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.UNIVERSAL_BIN}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.UNIVERSAL_BIN}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.UNIVERSAL_BIN}}" "{{.UNIVERSAL_BIN}}-amd64" "{{.UNIVERSAL_BIN}}-arm64"
      - rm "{{.UNIVERSAL_BIN}}-amd64" "{{.UNIVERSAL_BIN}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.UNIVERSAL_BIN}}" -input "{{.UNIVERSAL_BIN}}-amd64" -input "{{.UNIVERSAL_BIN}}-arm64"
      - rm -f "{{.UNIVERSAL_BIN}}-amd64" "{{.UNIVERSAL_BIN}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle
        vars:
          BINARY_SOURCE: '{{.OUTPUT | default .NATIVE_BIN}}'

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle
        vars:
          BINARY_SOURCE: '{{.UNIVERSAL_BIN}}'

  package:dmg:
    summary: Packages the application into a styled `.dmg`
    deps:
      - task: package
    cmds:
      - task: create:dmg

  create:dmg:
    summary: Creates a configurable `.dmg` from the `.app` bundle
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.APP_NAME}}" --out "{{.BIN_DIR}}"
        {{if .DMG_BACKGROUND}}--background "{{.DMG_BACKGROUND}}"{{end}}
        --volume-icon "{{.DMG_VOLUME_ICON}}"
        {{if .DMG_FILE_ICON}}--file-icon "{{.DMG_FILE_ICON}}"{{end}}
        --window-width "{{.DMG_WINDOW_WIDTH}}"
        --window-height "{{.DMG_WINDOW_HEIGHT}}"
        {{if .DMG_FILES}}--files "{{.DMG_FILES}}"{{end}}
    vars:
      # Background and Finder file art stay unset unless the project supplies owned
      # assets; the packager's plain treatment is the default. The volume icon is the
      # app icon generated from build/appicon.png.
      DMG_BACKGROUND: '{{.DMG_BACKGROUND | default ""}}'
      DMG_VOLUME_ICON: '{{.DMG_VOLUME_ICON | default "build/darwin/icons.icns"}}'
      DMG_FILE_ICON: '{{.DMG_FILE_ICON | default ""}}'
      DMG_WINDOW_WIDTH: '{{.DMG_WINDOW_WIDTH | default "540"}}'
      DMG_WINDOW_HEIGHT: '{{.DMG_WINDOW_HEIGHT | default "380"}}'
      DMG_FILES: '{{.DMG_FILES | default ""}}'


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p "{{.APP_BUNDLE}}/Contents/MacOS"
      - mkdir -p "{{.APP_BUNDLE}}/Contents/Resources"
      - cp build/darwin/icons.icns "{{.APP_BUNDLE}}/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.APP_BUNDLE}}/Contents/Resources"
        fi
      - cp "{{.BINARY_SOURCE}}" "{{.APP_BUNDLE}}/Contents/MacOS/{{.APP_NAME}}"
      - cp "{{.PLIST_SOURCE}}" "{{.APP_BUNDLE}}/Contents/Info.plist"
      - /usr/libexec/PlistBuddy -c 'Add :LSMinimumSystemVersion string {{.MACOS_MIN_VERSION}}' "{{.APP_BUNDLE}}/Contents/Info.plist"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'
        vars:
          APP_BUNDLE: '{{.APP_BUNDLE}}'
    vars:
      BINARY_SOURCE: '{{.BINARY_SOURCE | default .NATIVE_BIN}}'
      APP_BUNDLE: '{{.BIN_DIR}}/{{.APP_NAME}}{{if eq .DEV "true"}}.dev{{end}}.app'
      PLIST_SOURCE: 'build/darwin/Info{{if eq .DEV "true"}}.dev{{end}}.plist'

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - codesign --force --deep --sign - "{{.APP_BUNDLE}}"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - task: create:app:bundle
        vars:
          DEV: "true"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Uses signing identity from `wails3 setup` (stored in ~/.config/wails/defaults.yaml).
      Override with: task darwin:sign -- --identity "Developer ID Application: ..."
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" {{.CLI_ARGS}}

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Uses signing identity and keychain profile from `wails3 setup`.

      First-time setup:
        wails3 setup
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --notarize {{.CLI_ARGS}}
