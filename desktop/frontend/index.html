<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self'" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Flame</title>
    <script>
      (function () {
        var systemDark =
          !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var scheme = systemDark ? "dark" : "light";
        try {
          var raw = localStorage.getItem("flame.appearance");
          var state = raw ? JSON.parse(raw)?.state : null;
          var id = state?.theme;
          var paintRaw = localStorage.getItem("flame.theme-paint");
          var paint = paintRaw ? JSON.parse(paintRaw) : null;
          if (
            id !== "system" &&
            paint?.theme === id &&
            ["light", "dark"].includes(paint.scheme) &&
            /^#[0-9a-fA-F]{6}$/.test(paint.background)
          ) {
            scheme = paint.scheme;
          } else paint = null;
        } catch (_) {}
        var root = document.documentElement;
        root.dataset.visualStyle = state?.visualStyle || "flame";
        root.classList.add("theme-" + scheme);
        root.style.backgroundColor = scheme === "light" ? "#ffffff" : "#1f1f1f";
        if (paint) root.style.backgroundColor = paint.background;
      })();
    </script>
    <script src="/focus-modality.js"></script>
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/main.tsx" type="module"></script>
  </body>
</html>
